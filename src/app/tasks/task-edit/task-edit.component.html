<div class="task-form-container">
  <div class="form-section">
    <div class="header-section">
      <h2>Edit Task</h2>
      <app-back-button [route]="'/tasks'" [label]="'Back to Tasks'"></app-back-button>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-form-input
        label="Title"
        type="text"
        placeholder="Enter task title"
        [required]="true"
        [control]="form.get('title')">
      </app-form-input>

      <app-form-select
        label="Description"
        type="textarea"
        placeholder="Enter task description"
        [required]="true"
        [control]="form.get('description')">
      </app-form-select>

      <div class="form-row">
        <app-form-select
          label="Project"
          type="select"
          placeholder="Select a project"
          [required]="true"
          [options]="getProjectOptions()"
          [control]="form.get('projectId')">
        </app-form-select>

        <app-form-select
          label="Assigned Employee"
          type="select"
          placeholder="No assignment"
          [options]="getEmployeeOptions()"
          [control]="form.get('assignedEmployeeId')">
        </app-form-select>
      </div>

      <div class="form-row">
        <app-form-select
          label="Status"
          type="select"
          [options]="getStatusOptions()"
          [control]="form.get('status')">
        </app-form-select>

        <app-form-select
          label="Priority"
          type="select"
          [options]="getPriorityOptions()"
          [control]="form.get('priority')">
        </app-form-select>
      </div>

      <app-form-input
        label="Due Date"
        type="date"
        [required]="true"
        [control]="form.get('dueDate')">
      </app-form-input>

      @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }

      <app-button type="submit" variant="primary" size="md" [disabled]="form.invalid">Update Task</app-button>

      @if (successMessage()) {
        <p class="success-message">{{ successMessage() }}</p>
      }
    </form>
  </div>
</div>

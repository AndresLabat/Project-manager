<header class="app-header">
  <h1 class="app-title">{{ title() }}</h1>
  <nav class="app-nav">
    <ul>
      <li><a class="nav-link" (click)="router.navigate(['/projects'])">Projects</a></li>
      <li><a class="nav-link" (click)="router.navigate(['/employees'])">Employees</a></li>
    </ul>
  </nav>
  <div class="app-actions">
    @if (authService.isAuthenticated()) {
      <button class="nav-button" (click)="onLogout()">Logout</button>
    } @else {
      <button class="nav-button" (click)="router.navigate(['/login'])">Login</button>
    }
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

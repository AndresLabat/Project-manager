<div class="app-container">
  <aside class="app-sidebar">
    <div class="sidebar-header">
      <h1 class="app-title">{{ title() }}</h1>
    </div>
    
    <nav class="sidebar-nav">
      <ul>
        <li class="nav-item">
          <a 
            class="nav-link nav-toggle" 
            [class.active]="isActiveRoute('/projects')"
            (click)="toggleProjectsDropdown()">
            <span class="nav-icon">📁</span>
            <span class="nav-text">Projects</span>
            <span class="nav-arrow" [class.rotated]="projectsDropdownOpen()">›</span>
          </a>
          <ul class="nav-dropdown" [class.open]="projectsDropdownOpen()">
            <li>
              <a 
                class="nav-link nav-sub-link" 
                [class.active]="isActiveSubRoute('/projects')"
                (click)="router.navigate(['/projects'])">
                <span class="nav-icon">📋</span>
                <span class="nav-text">Lista de proyectos</span>
              </a>
            </li>
            <li>
              <a 
                class="nav-link nav-sub-link" 
                [class.active]="isActiveSubRoute('/projects/new')"
                (click)="router.navigate(['/projects/new'])">
                <span class="nav-icon">➕</span>
                <span class="nav-text">Añadir proyecto</span>
              </a>
            </li>
          </ul>
        </li>
        <li>
          <a 
            class="nav-link" 
            [class.active]="isActiveRoute('/employees')"
            (click)="router.navigate(['/employees'])">
            <span class="nav-icon">👥</span>
            <span class="nav-text">Employees</span>
          </a>
        </li>
        <li>
          <a 
            class="nav-link" 
            [class.active]="isActiveRoute('/tasks')"
            (click)="router.navigate(['/tasks'])">
            <span class="nav-icon">✅</span>
            <span class="nav-text">Tasks</span>
          </a>
        </li>
      </ul>
    </nav>
    
    <div class="sidebar-footer">
      @if (authService.isAuthenticated()) {
        <a 
          class="nav-link logout-link" 
          (click)="onLogout()">
          <span class="nav-icon">🚪</span>
          <span class="nav-text">Logout</span>
        </a>
      } @else {
        <a 
          class="nav-link login-link" 
          (click)="router.navigate(['/login'])">
          <span class="nav-icon">🔑</span>
          <span class="nav-text">Login</span>
        </a>
      }
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

<div class="detail-card">
  <div class="header-section">
    <h2>{{ title }}</h2>
    <app-back-button [route]="backRoute" [label]="backLabel"></app-back-button>
  </div>
  
  <div class="content-header">
    <ng-content select="[slot=title-section]"></ng-content>
    @if (showActions) {
      <div class="actions">
        <app-button variant="secondary" size="sm" (clicked)="onEdit()">{{ editLabel }}</app-button>
        <app-button variant="danger" size="sm" (clicked)="onDelete()">{{ deleteLabel }}</app-button>
      </div>
    }
  </div>
  
  <div class="content-body">
    <ng-content select="[slot=content]"></ng-content>
  </div>
</div>

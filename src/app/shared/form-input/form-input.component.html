<div class="form-group">
  <label [for]="getFieldId()">
    {{ label }}
    @if (required) {
      <span class="required">*</span>
    }
  </label>
  
  <input 
    [type]="type"
    [id]="getFieldId()"
    [value]="value"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [class.error]="hasError"
    (input)="onInput($event)"
    (blur)="onBlur()"
    (focus)="onFocus()"
    class="form-input">
    
  @if (hasError) {
    <p class="error-message">{{ displayErrorMessage }}</p>
  }
</div>

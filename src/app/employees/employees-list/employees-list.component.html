<div class="employees-container">
  <div class="list-section">
    <app-list-header 
      title="Employees" 
      buttonText="Add Employee" 
      [showButton]="authService.isAuthenticated()"
      (buttonClick)="addEmployee()">
    </app-list-header>

    @if (employees().length > 0) {
    <div class="employees-grid">
      @for (employee of employees(); track employee.id) {
        <app-list-card
          [title]="employee.fullName"
          [subtitle]="employee.role"
          [showActions]="true"
          [showViewButton]="true"
          [showEditButton]="authService.isAuthenticated()"
          [showDeleteButton]="authService.isAuthenticated()"
          (viewClick)="viewDetails(employee.id)"
          (editClick)="editEmployee(employee.id)"
          (deleteClick)="deleteEmployee(employee.id)">
          
          <div class="employee-details">
            <div class="detail-item">
              <span class="detail-label">Email:</span>
              <span class="detail-value">{{ employee.email }}</span>
            </div>
            
            <div class="detail-item">
              <span class="detail-label">Assigned Projects:</span>
              <span class="detail-value">{{ employee.assignedProjects.length }}</span>
            </div>
            
            <div class="detail-item">
              <span class="detail-label">Assigned Tasks:</span>
              <span class="detail-value">{{ employee.assignedTasks.length }}</span>
            </div>
          </div>
        </app-list-card>
      }
    </div>
    } @else {
      <div class="empty-state">
        <h3 class="empty-title">No employees found</h3>
        <p class="empty-message">There are no employees in the system yet.</p>
      </div>
    }
  </div>
</div>

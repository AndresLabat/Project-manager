<div class="employee-form">
  <div class="form-section">
    <div class="header-section">
      <h2>Edit Employee</h2>
      <app-back-button [route]="'/employees'" [label]="'Back to Employees'"></app-back-button>
    </div>
    <form [formGroup]="form" (ngSubmit)="updateEmployee()">
      <app-form-input
        label="Full Name"
        type="text"
        placeholder="Enter full name"
        [required]="true"
        [control]="form.get('fullName')">
      </app-form-input>

      <app-form-input
        label="Email"
        type="email"
        placeholder="Enter email address"
        [required]="true"
        [control]="form.get('email')">
      </app-form-input>

      <app-form-input
        label="Role"
        type="text"
        placeholder="Enter role (e.g., Developer, Designer)"
        [required]="true"
        [control]="form.get('role')">
      </app-form-input>

      <app-button type="submit" variant="primary" size="md" [disabled]="form.invalid">Update Employee</app-button>

      @if (successMessage()) {
        <p class="success-message">{{ successMessage() }}</p>
      }
    </form>
  </div>
</div>

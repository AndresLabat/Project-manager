<div class="project-form">
  <div class="form-section">
    <div class="header-section">
      <h2>Add Project</h2>
      <app-back-button [route]="'/projects'" [label]="'Back to Projects'"></app-back-button>
    </div>
    <form [formGroup]="form" (ngSubmit)="addProject()">
      <app-form-input
        label="Name"
        type="text"
        placeholder="Enter project name"
        [required]="true"
        [control]="form.get('name')">
      </app-form-input>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea 
          id="description"
          formControlName="description" 
          class="form-textarea"
          [class.error]="form.get('description')?.invalid && form.get('description')?.touched"
          placeholder="Enter project description"></textarea>
        @if (form.get('description')?.invalid && form.get('description')?.touched) {
          <p class="error-message">{{ getDescriptionErrorMessage() }}</p>
        }
      </div>

      <app-form-input
        label="Start Date"
        type="date"
        [required]="true"
        [control]="form.get('startDate')">
      </app-form-input>

      <app-form-input
        label="End Date"
        type="date"
        [control]="form.get('endDate')">
      </app-form-input>

      <div class="form-group">
        <label for="assignedEmployees">Assign Employees</label>
        <select 
          id="assignedEmployees"
          formControlName="assignedEmployees" 
          class="form-select"
          multiple>
          @for (employee of employees; track employee.id) {
            <option [value]="employee.id">{{ employee.fullName }} ({{ employee.role }})</option>
          }
        </select>
        <p class="form-hint">Hold Ctrl/Cmd to select multiple employees</p>
      </div>


      <app-button type="submit" variant="primary" size="md" [disabled]="form.invalid">Add Project</app-button>

      @if (successMessage()) {
        <p class="success-message">{{ successMessage() }}</p>
      }
    </form>
  </div>
</div>

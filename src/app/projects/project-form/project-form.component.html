<h2>Add Project</h2>
<form (ngSubmit)="addProject()">
  <label>
    Name:
    <input type="text" [(ngModel)]="projectName" name="name" required>
  </label>
  <label>
    Description:
    <input type="text" [(ngModel)]="projectDescription" name="description">
  </label>
  <button type="submit">Add Project</button>
</form>

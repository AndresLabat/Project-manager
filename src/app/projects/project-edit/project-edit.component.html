<h2>Edit Project</h2>

<form [formGroup]="form" (ngSubmit)="updateProject()">
  <label>
    Name:
    <input type="text" formControlName="name" required>
  </label>

  <label>
    Description:
    <input type="text" formControlName="description">
  </label>

  <label>
    Start Date:
    <input type="date" formControlName="startDate" required>
  </label>

  <label>
    End Date:
    <input type="date" formControlName="endDate">
  </label>

  <button type="submit" [disabled]="form.invalid">Update Project</button>

  @if (form.get('name')?.invalid && form.get('name')?.touched) {
    <p style="color: red;">{{ getNameErrorMessage() }}</p>
  }

  @if (form.get('description')?.invalid && form.get('description')?.touched) {
    <p style="color: red;">{{ getDescriptionErrorMessage() }}</p>
  }

  @if (form.hasError('dateRange')) {
    <p style="color: red;">End date must be after start date</p>
  }
</form>

<div class="login-form">
  <h2>Login</h2>
  
  <form [formGroup]="form" (ngSubmit)="onLogin()">
  <div class="form-group">
    <label>
      Username: <span class="required">*</span>
    </label>
    <input type="text" formControlName="username" required placeholder="Enter your username" class="form-input">
  </div>

  <div class="form-group">
    <label>
      Password: <span class="required">*</span>
    </label>
    <input type="password" formControlName="password" required placeholder="Enter your password" class="form-input">
  </div>

  <button type="submit" [disabled]="form.invalid">Login</button>

  @if (form.get('username')?.invalid && form.get('username')?.touched) {
    <p class="error-message">Username is required</p>
  }

  @if (form.get('password')?.invalid && form.get('password')?.touched) {
    <p class="error-message">Password is required</p>
  }

  @if (form.errors?.['invalidLogin']) {
    <p class="error-message">Incorrect username or password</p>
  }

  <p class="legend">
    <span class="required">*</span> Required fields
  </p>
  </form>
</div>

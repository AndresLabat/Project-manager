<div class="login-form">
  <div class="header-section">
    <h2>Login</h2>
    <button 
      class="btn-continue" 
      type="button" 
      (click)="continueWithoutLogin()">
      Continue without login ⟶
    </button>
  </div>
  
  <div class="form-section">
    <form [formGroup]="form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Username *</label>
        <input 
          type="text" 
          id="username"
          formControlName="username" 
          class="form-input"
          [class.error]="form.get('username')?.invalid && form.get('username')?.touched"
          placeholder="Enter your username">
        @if (form.get('username')?.invalid && form.get('username')?.touched) {
          <p class="error-message">Username is required</p>
        }
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <input 
          type="password" 
          id="password"
          formControlName="password" 
          class="form-input"
          [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
          placeholder="Enter your password">
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <p class="error-message">Password is required</p>
        }
      </div>

      @if (form.errors?.['invalidLogin']) {
        <p class="error-message">Incorrect username or password</p>
      }

      <app-button type="submit" variant="primary" size="md" [disabled]="form.invalid">Login</app-button>
    </form>
  </div>
</div>

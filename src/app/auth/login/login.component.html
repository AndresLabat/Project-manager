<div class="login-container">
  <div class="login-card">
    <div class="brand-section">
      <div class="logo">
        <span class="logo-main">PROJECT</span>
        <span class="logo-sub">MANAGER</span>
      </div>
      <h1 class="welcome-title">Welcome to Project Manager</h1>
      <p class="welcome-subtitle">Enter your credentials to login</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onLogin()" class="login-form">
      <app-form-input
        label="Username"
        type="text"
        placeholder="Enter your username"
        [required]="true"
        [control]="form.get('username')">
      </app-form-input>

      <app-form-input
        label="Password"
        type="password"
        placeholder="Enter your password"
        [required]="true"
        [control]="form.get('password')">
      </app-form-input>

      <button 
        type="submit"
        class="login-button"
        [disabled]="form.invalid">
        Login ⟶
      </button>

      @if (form.errors?.['invalidLogin']) {
        <p class="error-message">Incorrect username or password</p>
      }

    </form>

    <div class="continue-section">
      <button 
        class="btn-continue" 
        type="button" 
        (click)="continueWithoutLogin()">
        Continue as guest ⟶
      </button>
    </div>
  </div>
</div>
